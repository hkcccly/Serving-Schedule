<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會主日事奉人員編排器</title>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-color: #1d1d1f;
      --secondary-text: #86868b;
      --accent-color: #0071e3;
      --border-radius: 16px;
      --border-color: rgba(0, 0, 0, 0.1);
      --item-bg: #f2f2f7;
    }

    body.dark-mode {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --text-color: #f5f5f7;
      --secondary-text: #98989d;
      --accent-color: #0a84ff;
      --border-color: rgba(255, 255, 255, 0.15);
      --item-bg: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-weight: 600;
      font-size: 26px;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .update-notice {
      font-size: 12px;
      color: var(--secondary-text);
      background: var(--card-bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
    }

    .red-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: #ff3b30;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 6px #ff3b30;
      animation: pulse-red-dot 2s infinite;
      vertical-align: middle;
    }

    @keyframes pulse-red-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .updated-badge-green {
      font-size: 11px;
      color: #34c759;
      background: rgba(52, 199, 89, 0.12);
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      font-weight: 500;
    }

    .green-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #34c759;
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 6px #34c759;
      animation: pulse-green-dot 2s infinite;
    }

    @keyframes pulse-green-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 20px;
