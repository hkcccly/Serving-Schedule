<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會主日事奉人員編排器</title>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-color: #1d1d1f;
      --secondary-text: #86868b;
      --accent-color: #0071e3;
      --border-radius: 16px;
      --border-color: rgba(0, 0, 0, 0.1);
      --item-bg: #f2f2f7;
    }

    body.dark-mode {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --text-color: #f5f5f7;
      --secondary-text: #98989d;
      --accent-color: #0a84ff;
      --border-color: rgba(255, 255, 255, 0.15);
      --item-bg: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-weight: 600;
      font-size: 26px;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .update-notice {
      font-size: 12px;
      color: var(--secondary-text);
      background: var(--card-bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
    }

    .red-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: #ff3b30;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 6px #ff3b30;
      animation: pulse-red-dot 2s infinite;
      vertical-align: middle;
    }

    @keyframes pulse-red-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .updated-badge-green {
      font-size: 11px;
      color: #34c759;
      background: rgba(52, 199, 89, 0.12);
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      font-weight: 500;
    }

    .green-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #34c759;
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 6px #34c759;
      animation: pulse-green-dot 2s infinite;
    }

    @keyframes pulse-green-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--accent-color);
      color: white;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      font-size: 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--secondary-text);
    }

    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 10px;
    }

    .date-badge {
      font-weight: 600;
      font-size: 17px;
      color: var(--accent-color);
    }

    .role-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
      margin-right: 15px;
    }

    .role-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .role-item {
      background: var(--item-bg);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .secondary-action-btn {
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 7px 14px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .secondary-action-btn:hover {
      background: var(--accent-color);
      color: white;
    }

    .loading, .error-box {
      text-align: center;
      color: var(--secondary-text);
      padding: 30px;
      font-size: 14px;
    }

    .error-box {
      color: #ff3b30;
      background: rgba(255, 59, 48, 0.08);
      border-radius: 12px;
      padding: 20px;
      line-height: 1.6;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      color: var(--text-color);
      width: 90%;
      max-width: 440px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.15);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 12px;
      color: var(--secondary-text);
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      color: var(--secondary-text);
      display: block;
      margin-bottom: 4px;
    }

    .form-select {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--item-bg);
      color: var(--text-color);
      outline: none;
      box-sizing: border-box;
    }

    .role-select-btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: var(--item-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .role-select-btn:hover {
      border-color: var(--accent-color);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .cancel-btn {
      background: var(--item-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 16px;
      border-radius: 980px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>主日崇拜事奉人員表</h1>
      <div class="header-controls">
        <div class="update-notice" id="lastUpdate"><span class="red-dot"></span>載入中...</div>
        <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌓 模式</button>
      </div>
    </header>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜尋日期、角色或人員姓名...">
    </div>

    <div id="scheduleContainer">
      <div class="loading">正在載入...</div>
    </div>
  </div>

  <div class="modal-overlay" id="generalModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">標題</div>
      <div class="modal-subtitle" id="modalSubtitle">說明</div>
      <div id="modalBody"></div>
      <div class="modal-footer">
        <button class="cancel-btn" onclick="closeModal()">關閉</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mhxxbkaplbwzbdtewcxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_q9qFHq4I7aBj6XqT_bPEFA_BjLGoBbc';
    
    let supabaseClient = null;
    try {
      if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase 初始化失敗:", e);
    }

    let scheduleData = [];
    
    // 嚴格規定的職分次序：領唱，隊員，司琴，司他，鼓手
    const roleOrder = ["領唱", "隊員", "司琴", "司他", "鼓手"];
    const allowedRoles = [...roleOrder];
    let currentActiveId = null;

    const vocalRoles = ["領唱", "隊員"];
    const instrumentRoles = ["司琴", "司他", "鼓手"];

    async function fetchSchedules() {
      if (!supabaseClient) {
        document.getElementById("scheduleContainer").innerHTML = '<div class="error-box">⚠️ Supabase SDK 載入失敗，請檢查網路或 CDN 連線。</div>';
        document.getElementById("lastUpdate").innerHTML = '<span class="red-dot"></span>SDK 載入失敗';
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('schedules')
          .select('*')
          .order('date', { ascending: true });

        if (error) throw error;

        scheduleData = data || [];
        renderSchedule(document.getElementById("searchInput").value);
        updateGlobalLastModified();
      } catch (err) {
        document.getElementById("scheduleContainer").innerHTML = 
          '<div class="error-box">' +
          '<b>⚠️ 載入失敗</b><br>' +
          '錯誤訊息：' + (err.message || err) + '<br><br>' +
          '<b>排查建議：</b><br>' +
          '1. 確認 Supabase 資料表名稱是否為 <code>schedules</code>。<br>' +
          '2. 確認已在 Supabase 執行公開讀寫 (RLS) 政策。' +
          '</div>';
        document.getElementById("lastUpdate").innerHTML = '<span class="red-dot"></span>連線失敗';
      }
    }

    function updateGlobalLastModified() {
      if (!scheduleData || scheduleData.length === 0) return;
      let latest = scheduleData.reduce((max, item) => item.updated_at > max ? item.updated_at : max, scheduleData[0].updated_at);
      const timeStr = new Date(latest).toLocaleString('zh-Hant', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById("lastUpdate").innerHTML = '<span class="red-dot"></span>已更新：' + timeStr;
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('church_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    if (localStorage.getItem('church_theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    function highlightText(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp('(' + escaped + ')', 'gi');
      return text.replace(regex, '<span style="color: var(--accent-color); font-weight: 600; background: rgba(0, 113, 227, 0.12); padding: 0 3px; border-radius: 4px;">$1</span>');
    }

    function renderSchedule(filter = "") {
      const container = document.getElementById("scheduleContainer");
      container.innerHTML = "";

      const now = new Date();
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      
      const trimmedFilter = filter.trim();

      const filtered = scheduleData.filter(item => {
        const rolesString = Object.entries(item.roles || {})
          .filter(([k]) => allowedRoles.includes(k))
          .map(([k, v]) => Array.isArray(v) ? k + ':' + v.join(" ") : k + ':' + v)
          .join(" ");
        const text = item.date + ' ' + rolesString;
        const matches = text.toLowerCase().includes(trimmedFilter.toLowerCase());

        if (!trimmedFilter && item.date < todayStr) {
          return false;
        }

        return matches;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading">目前沒有符合的事奉資料</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "schedule-card";
        
        const sortedRoles = Object.entries(item.roles || {})
          .filter(([k]) => allowedRoles.includes(k))
          .sort(([a], [b]) => roleOrder.indexOf(a) - roleOrder.indexOf(b));

        let htmlContent = "";
        sortedRoles.forEach(([role, person]) => {
          let snippet = Array.isArray(person) 
            ? person.map(p => '<span class="role-item"><b>' + role + '</b>: ' + highlightText(p, trimmedFilter) + '</span>').join('')
            : '<span class="role-item"><b>' + role + '</b>: ' + highlightText(person, trimmedFilter) + '</span>';
          htmlContent += '<div class="role-row">' + snippet + '</div>';
        });

        const isUpdated = item.roles && item.roles._is_updated;

        card.innerHTML = 
          '<div class="role-section">' +
            '<div class="card-header-row">' +
              '<div class="date-badge">📅 ' + highlightText(item.date, trimmedFilter) + '</div>' +
              (isUpdated ? '<div class="updated-badge-green"><span class="green-dot"></span>已更新</div>' : '') +
            '</div>' +
            (htmlContent || '<span style="color:var(--secondary-text);font-size:13px;">無排班資料</span>') +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="secondary-action-btn" onclick="openReplaceModal(' + item.id + ', \'' + item.date + '\')">直接替換</button>' +
            '<button class="secondary-action-btn" onclick="openSwapModal(' + item.id + ', \'' + item.date + '\')">事奉對調</button>' +
          '</div>';
        container.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderSchedule(e.target.value);
    });

    function closeModal() {
      document.getElementById("generalModal").classList.remove("active");
    }

    // 直接替換
    function openReplaceModal(id, date) {
      currentActiveId = id;
      const item = scheduleData.find(s => s.id === id);
      document.getElementById("modalTitle").textContent = date + ' 直接替換';
      document.getElementById("modalSubtitle").textContent = "請選擇您想替換的人員：";
      const body = document.getElementById("modalBody");
      body.innerHTML = "";

      const sortedRoles = Object.entries(item.roles || {})
        .filter(([k]) => allowedRoles.includes(k))
        .sort(([a], [b]) => roleOrder.indexOf(a) - roleOrder.indexOf(b));

      sortedRoles.forEach(([role, val]) => {
        const persons = Array.isArray(val) ? val : [val];
        persons.forEach(person => {
          const btn = document.createElement("button");
          btn.className = "role-select-btn";
          btn.innerHTML = '<b>' + role + '</b>：' + person + ' <span style="float:right; color:var(--accent-color);">替換 ➔</span>';
          btn.onclick = () => selectReplaceTarget(role, person, date);
          body.appendChild(btn);
        });
      });
      document.getElementById("generalModal").classList.add("active");
    }

    function selectReplaceTarget(role, oldPerson, date) {
      const isVocal = vocalRoles.includes(role);
      const targetRoles = isVocal ? vocalRoles : instrumentRoles;
      const nameSet = new Set();
      scheduleData.forEach(item => {
        Object.entries(item.roles || {}).forEach(([r, val]) => {
          if (targetRoles.includes(r)) {
            if (Array.isArray(val)) val.forEach(v => nameSet.add(v));
            else if (typeof val === 'string') nameSet.add(val);
          }
        });
      });
      const candidates = Array.from(nameSet).sort();

      const body = document.getElementById("modalBody");
      let optionsHtml = candidates.map(n => '<option value="' + n + '" ' + (n === oldPerson ? 'selected' : '') + '>' + n + '</option>').join('');

      body.innerHTML = 
        '<div style="margin-bottom: 12px; font-size: 14px;">替換 <b>' + date + '</b> 的 <b>' + role + '</b>（原：<b>' + oldPerson + '</b>）</div>' +
        '<div class="form-group">' +
          '<label class="form-label">新人員：</label>' +
          '<select id="targetNewPerson" class="form-select">' + optionsHtml + '</select>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="cancel-btn" onclick="openReplaceModal(' + currentActiveId + ', \'' + date + '\')">返回</button>' +
          '<button class="secondary-action-btn" onclick="executeReplace(\'' + role + '\', \'' + oldPerson + '\', \'' + date + '\')">確認替換</button>' +
        '</div>';
    }

    async function executeReplace(role, oldPerson, sourceDate) {
      const newPerson = document.getElementById("targetNewPerson").value;
      const item = scheduleData.find(s => s.id === currentActiveId);
      if (!item) return;

      const now = new Date().toISOString();
      let val = item.roles[role];
      item.roles[role] = Array.isArray(val) ? val.map(p => p === oldPerson ? newPerson : p) : newPerson;
      item.roles._is_updated = true;
      item.updated_at = now;

      const { error } = await supabaseClient.from('schedules').update({ roles: item.roles, updated_at: now }).eq('id', currentActiveId);
      if (error) { alert('失敗：' + error.message); return; }

      closeModal();
      alert('已將 ' + sourceDate + ' 的 ' + role + '【' + oldPerson + '】替換為【' + newPerson + '】！');
      fetchSchedules();
    }

    // 事奉對調
    function openSwapModal(id, date) {
      currentActiveId = id;
      const item = scheduleData.find(s => s.id === id);
      document.getElementById("modalTitle").textContent = date + ' 事奉對調';
      document.getElementById("modalSubtitle").textContent = "請選擇您想對調的人員：";
      const body = document.getElementById("modalBody");
      body.innerHTML = "";

      const sortedRoles = Object.entries(item.roles || {})
        .filter(([k]) => allowedRoles.includes(k))
        .sort(([a], [b]) => roleOrder.indexOf(a) - roleOrder.indexOf(b));

      sortedRoles.forEach(([role, val]) => {
        const persons = Array.isArray(val) ? val : [val];
        persons.forEach(person => {
          const btn = document.createElement("button");
          btn.className = "role-select-btn";
          btn.innerHTML = '<b>' + role + '</b>：' + person + ' <span style="float:right; color:var(--accent-color);">對調 ➔</span>';
          btn.onclick = () => selectSwapTarget(role, person, date);
          body.appendChild(btn);
        });
      });
      document.getElementById("generalModal").classList.add("active");
    }

    function selectSwapTarget(role, oldPerson, date) {
      const body = document.getElementById("modalBody");

      const now = new Date();
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const futureSchedules = scheduleData.filter(d => d.date >= todayStr);

      let dateOptions = futureSchedules.map(d => '<option value="' + d.id + '" ' + (d.id === currentActiveId ? 'selected' : '') + '>' + d.date + '</option>').join('');

      body.innerHTML = 
        '<div style="margin-bottom: 12px; font-size: 14px;">對調 <b>' + date + '</b> 的 <b>' + role + '</b>（原：<b>' + oldPerson + '</b>）</div>' +
        '<div class="form-group">' +
          '<label class="form-label">對換日期：</label>' +
          '<select id="targetSwapDateId" class="form-select" onchange="updateSwapCandidates(\'' + role + '\')">' + dateOptions + '</select>' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label">對換事奉人員：</label>' +
          '<select id="targetSwapPerson" class="form-select"></select>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="cancel-btn" onclick="openSwapModal(' + currentActiveId + ', \'' + date + '\')">返回</button>' +
          '<button class="secondary-action-btn" onclick="executeSwap(\'' + role + '\', \'' + oldPerson + '\', \'' + date + '\')">確認對調</button>' +
        '</div>';

      // 初始化載入當天事奉人員名單
      updateSwapCandidates(role);
    }

    // 動態更新對換日期的當天事奉人員選單
    function updateSwapCandidates(role) {
      const targetDateId = parseInt(document.getElementById("targetSwapDateId").value);
      const targetItem = scheduleData.find(s => s.id === targetDateId);
      const personSelect = document.getElementById("targetSwapPerson");
      if (!targetItem || !personSelect) return;

      const isVocal = vocalRoles.includes(role);
      const targetRoles = isVocal ? vocalRoles : instrumentRoles;

      const servingNames = [];
      Object.entries(targetItem.roles || {}).forEach(([r, val]) => {
        if (targetRoles.includes(r)) {
          if (Array.isArray(val)) {
            val.forEach(p => servingNames.push(p));
          } else if (typeof val === 'string') {
            servingNames.push(val);
          }
        }
      });

      const uniqueNames = Array.from(new Set(servingNames)).sort();
      personSelect.innerHTML = uniqueNames.map(n => '<option value="' + n + '">' + n + '</option>').join('');
    }

    async function executeSwap(role, oldPerson, sourceDate) {
      const targetSwapPerson = document.getElementById("targetSwapPerson").value;
      const targetDateId = parseInt(document.getElementById("targetSwapDateId").value);

      if (!targetSwapPerson) {
        alert('請選擇對換的事奉人員！');
        return;
      }

      const sourceItem = scheduleData.find(s => s.id === currentActiveId);
      const targetItem = scheduleData.find(s => s.id === targetDateId);
      if (!sourceItem || !targetItem) return;

      const now = new Date().toISOString();

      // 1. 更新來源卡片
      let sVal = sourceItem.roles[role];
      sourceItem.roles[role] = Array.isArray(sVal) ? sVal.map(p => p === oldPerson ? targetSwapPerson : p) : targetSwapPerson;
      sourceItem.roles._is_updated = true;
      sourceItem.updated_at = now;

      // 2. 更新目標卡片（尋找該人員在目標日期中的職分並與 oldPerson 對調）
      if (sourceItem.id !== targetItem.id) {
        Object.entries(targetItem.roles || {}).forEach(([r, val]) => {
          if (allowedRoles.includes(r)) {
            if (Array.isArray(val)) {
              if (val.includes(targetSwapPerson)) {
                targetItem.roles[r] = val.map(p => p === targetSwapPerson ? oldPerson : p);
              }
            } else if (val === targetSwapPerson) {
              targetItem.roles[r] = oldPerson;
            }
          }
        });
        targetItem.roles._is_updated = true;
        targetItem.updated_at = now;
        await supabaseClient.from('schedules').update({ roles: targetItem.roles, updated_at: now }).eq('id', targetItem.id);
      }

      const { error } = await supabaseClient.from('schedules').update({ roles: sourceItem.roles, updated_at: now }).eq('id', sourceItem.id);
      if (error) { alert('對調失敗：' + error.message); return; }

      closeModal();
      alert('已成功將 ' + sourceDate + ' 的 ' + role + '【' + oldPerson + '】與 ' + targetItem.date + ' 的【' + targetSwapPerson + '】對調！');
      fetchSchedules();
    }

    fetchSchedules();
  </script>
